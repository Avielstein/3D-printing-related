# PrusaSlicer config for Lulzbot Mini + TPU (3mm filament, 0.5mm nozzle).
#
# Load with:  prusa-slicer --load lulzbot_mini_tpu.ini --export-gcode ...
# Or via the `lulz slice` subcommand, which passes this file automatically.
#
# This is a STARTING POINT. PrusaSlicer ships no Lulzbot Mini system preset,
# so all of the values below are hand-derived from CuraLE's TPU profile
# and the existing scripts. Expect to iterate after the first print —
# likely candidates: first_layer_height, extrusion_multiplier, retract_length.
#
# Quick swap to PLA: set filament_diameter=2.85, temperature=205,
# first_layer_temperature=210, bed_temperature=60, retract_length=1.5,
# perimeter_speed=40, and remove the 30mm retract from start_gcode.

# ---- printer ----
printer_model = Lulzbot Mini
printer_variant = 0.5
bed_shape = 0x0,152x0,152x152,0x152
max_print_height = 158
nozzle_diameter = 0.5
extruder_offset = 0x0
gcode_flavor = marlin
single_extruder_multi_material = 0
use_relative_e_distances = 0
use_firmware_retraction = 0
use_volumetric_e = 0

# ---- filament (TPU) ----
filament_diameter = 2.85
filament_density = 1.21
filament_type = FLEX
temperature = 225
first_layer_temperature = 240
bed_temperature = 60
first_layer_bed_temperature = 65
filament_cost = 0
filament_settings_id = LulzbotMini_TPU

# ---- retraction ----
# In-print retract is tiny: TPU does not like aggressive retract (strips at
# the drive gear, clogs the cold zone). The 30mm anti-ooze retract belongs
# ONLY in start_gcode (`G1 E-30 F75` there), not as a per-travel value.
# Earlier we mistakenly used 30 here — every layer change inserted a 48s
# pause and ballooned the estimate to 7.5 hours.
retract_length = 1.5
retract_speed = 20
deretract_speed = 20
retract_before_travel = 3
retract_layer_change = 0
retract_lift = 0
wipe = 0

# ---- print settings ----
layer_height = 0.2
first_layer_height = 0.3
perimeters = 3
top_solid_layers = 4
bottom_solid_layers = 4
fill_density = 20%
fill_pattern = grid
external_perimeters_first = 0
seam_position = aligned
skirts = 2
skirt_distance = 3
skirt_height = 1
brim_width = 0

# ---- speeds (TPU is slow; F50 is the upper bound for safe extrusion) ----
first_layer_speed = 10
perimeter_speed = 15
external_perimeter_speed = 12
infill_speed = 20
solid_infill_speed = 18
top_solid_infill_speed = 15
travel_speed = 100
gap_fill_speed = 15
small_perimeter_speed = 12

# ---- acceleration ----
default_acceleration = 500
perimeter_acceleration = 500
infill_acceleration = 500
first_layer_acceleration = 300
travel_acceleration = 1000

# ---- cooling ----
fan_always_on = 0
cooling = 1
min_fan_speed = 0
max_fan_speed = 50
fan_below_layer_time = 30
slowdown_below_layer_time = 5
min_print_speed = 5

# ---- start G-code: heat → G28 → retract → wipe → heat for print → prime ----
#
# Design rationale:
# - G28 on Lulzbot Mini uses the nozzle-as-probe Z homing routine. Without
#   it, the wipe sequence's hardcoded Z values reference an unknown frame —
#   exactly what was happening when the nozzle gouged the wiper pad base
#   during early prints (2026-05-24). G28 MUST happen before the wipe.
# - We drop G29 (the 4-corner probe). It halts on this machine due to flaky
#   z_min wiring. The single nozzle-as-probe Z home from G28 is enough for
#   printing once we know the paper-test offset.
# - Paper-test offset: run `lulz papertest --use-g28` then `papertest write`
#   to splice `G92 Z<offset>` between G28 and the wipe below. Without that
#   patch, Marlin's Z=0 is the firmware's probe offset, not bed glass.
# - Wipe Z values match Cura's originals (Z=0 = pad top, Z=-0.5 = into
#   the squishy pad). Verified by hand: `wipe 0` does the right thing on
#   this physical machine. If you replace the pad and it sits higher,
#   tune with `wipe 0.5`, `wipe 1.0`, etc. from the lulz> session, then
#   bump every Z value below by that offset.
# - M117 messages label each phase on the LCD.
start_gcode = G21\nM107\nG90\nM82\nG92 E0\nM117 Heating\nM140 S[first_layer_bed_temperature]\nM109 R180\nM117 Homing\nG28\nG92 Z1.000\nM117 Anti-ooze retract\nG1 E-30 F75\nM117 Wiping\nG1 X42 Y173 F11520\nG1 Z0 F1200\nG1 X42 Y173 Z-0.5 F4000\nG1 X52 Y171 Z-0.5 F4000\nG1 X42 Y173 Z0 F4000\nG1 X52 Y171 F4000\nG1 X42 Y173 F4000\nG1 X52 Y171 F4000\nG1 X57 Y173 F4000\nG1 X77 Y171 F4000\nG1 X87 Y171 F4000\nG1 X97 Y171 F4000\nG1 X107 Y173 F4000\nG1 X112 Y171 Z-0.5 F1000\nG1 Z10 F600\nM117 Heating for print\nM190 S[first_layer_bed_temperature]\nM109 S[first_layer_temperature]\nG92 E0\nG1 E5 F75\nG92 E0\nM117 Printing

# ---- end G-code: safe shutdown ----
end_gcode = M400\nM104 S0\nM140 S0\nG91\nG1 E-5 F300\nG90\nG28 X Y\nM84
